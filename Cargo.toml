[package]
name = "bevy-game-bits"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.18", features = ["ktx2", "zstd_rust", "wav", "experimental_pbr_pcss"] }
bevy_hanabi = "0.18"
# Pinned to 0.6: the 0.7 release requires Bevy 0.19. Used by examples/009-derby.
avian3d = "0.6"
# Pinned to 0.14: the 0.15 release requires Bevy 0.19. Used data-only (no 2D
# rendering) — see examples/008-colony.
bevy_ecs_ldtk = { version = "0.14.0", default-features = false, features = [
  "derive",
  "internal_levels",
] }
log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
# Already resolved transitively via bevy_gltf; promoted to a direct
# dependency for examples/009-derby's `export.rs`, which hand-builds the
# derby car's GLB from its procedural meshes/materials.
gltf-json = { version = "1.4", features = ["names", "KHR_materials_emissive_strength"] }
serde_json = "1"
# `derive` for `src/world_map/`'s JSON map format (`examples/009-world-map`).
# `serde_json` was already here for 009-derby's exporter; this promotes the
# `serde` core crate (already in the lock transitively) to a direct dep.
serde = { version = "1", features = ["derive"] }

# `dynamic_linking` links `bevy_dylib`, which cannot be built for wasm. Keeping it in a
# target-conditional section means `cargo run --example …` is unchanged natively while
# `bevy build web` just doesn't see it — no `--no-default-features` dance, no new feature flag.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { version = "0.18", features = ["dynamic_linking"] }

# Enable the `getrandom` web backend. `bevy-cli` injects the matching
# `--cfg getrandom_backend="wasm_js"` rustflag automatically when it detects a `^0.3`
# `getrandom` in the dependency tree; the feature still has to be turned on here.
[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { version = "0.4", features = ["wasm_js"], package = "getrandom" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1

# FIXME: Disabled, because it causes a crash on Windows on release mode, with Bevy 0.15.3 on the Infinite Runner example.
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
# lto = "thin"

# `web-release` is the profile name `bevy-cli` selects for `bevy build --release web`
# (see `bevy_cli::web::profiles`) — it only injects its own default when the manifest
# doesn't define one, so this profile takes over cleanly.
# Optimize for size to reduce load times and bandwidth usage on web.
[profile.web-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
# Safe to enable here (unlike the native `release` profile above): the Windows-crash
# FIXME on `[profile.release]`'s `lto` is native-only and doesn't apply to wasm.
lto = "thin"

# `web` is the profile `bevy-cli` selects for `bevy run web` (non-release) — fast
# iteration, same as native `dev`.
[profile.web]
inherits = "dev"
