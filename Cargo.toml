[package]
name = "bevy-game-bits"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.18", features = ["dynamic_linking", "ktx2", "zstd_rust", "wav", "experimental_pbr_pcss"] }
bevy_hanabi = "0.18"
# Pinned to 0.6: the 0.7 release requires Bevy 0.19. Used by examples/009-derby.
avian3d = "0.6"
# Pinned to 0.14: the 0.15 release requires Bevy 0.19. Used data-only (no 2D
# rendering) — see examples/008-colony.
bevy_ecs_ldtk = { version = "0.14.0", default-features = false, features = [
  "derive",
  "internal_levels",
] }
log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
# Already resolved transitively via bevy_gltf; promoted to a direct
# dependency for examples/009-derby's `export.rs`, which hand-builds the
# derby car's GLB from its procedural meshes/materials.
gltf-json = { version = "1.4", features = ["names", "KHR_materials_emissive_strength"] }
serde_json = "1"
# `derive` for `src/world_map/`'s JSON map format (`examples/009-world-map`).
# `serde_json` was already here for 009-derby's exporter; this promotes the
# `serde` core crate (already in the lock transitively) to a direct dep.
serde = { version = "1", features = ["derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1

# FIXME: Disabled, because it causes a crash on Windows on release mode, with Bevy 0.15.3 on the Infinite Runner example.
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
# lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
