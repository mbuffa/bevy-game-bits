<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bevy-game-bits</title>
    <style>
      :root {
        --bg-color: #2b2c2f;
        --fg-color: #ececec;
        --dim-color: #888;
        --accent-color: #6ab0f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem;
        min-height: 100vh;
        background-color: var(--bg-color);
        color: var(--fg-color);
        font: 16px/1.4 system-ui, sans-serif;
      }

      h1 {
        margin: 0 0 0.25em;
      }

      p.subtitle {
        margin: 0 0 2em;
        color: var(--dim-color);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0.75em;
        max-width: 900px;
      }

      li {
        border: 1px solid #444;
        border-radius: 6px;
        padding: 0.75em 1em;
      }

      li a {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 600;
      }

      li a:hover {
        text-decoration: underline;
      }

      li.skipped {
        color: var(--dim-color);
        border-style: dashed;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>bevy-game-bits</h1>
    <p class="subtitle">
      Bevy Engine learning examples, built for the browser via
      <code>bevy-cli</code>. Run <code>make web-all</code> to regenerate.
    </p>
    <ul>
      <!-- EXAMPLES -->
    </ul>
  </body>
</html>
